# ============================================================
# PREDICCIÓN CLIMÁTICA ML · Despliegue en Fly.io
# ============================================================
# Uso:
#   fly launch --no-deploy --copy-config
#   fly deploy
# ============================================================

app = "clima-ml-api"
primary_region = "mad"

[build]
  dockerfile = "Dockerfile"

[env]
  PYTHONUTF8 = "1"
  PYTHONUNBUFFERED = "1"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    interval = "30s"
    timeout = "10s"
    method = "GET"
    path = "/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"
